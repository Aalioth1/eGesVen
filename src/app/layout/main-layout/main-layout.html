<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="brand">
      <h1>eGesVen</h1>
      <span>Gestión de Ventas</span>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>

      <a
        mat-list-item
        routerLink="/catalog"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Catálogo</span>
      </a>

      <a
        mat-list-item
        routerLink="/products"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>

      <a
        mat-list-item
        routerLink="/cart"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Pedido</span>
      </a>

      <a
        mat-list-item
        routerLink="/payment"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>payments</mat-icon>
        <span matListItemTitle>Pago</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="page-title">Sistema eGesVen</span>

      <span class="toolbar-spacer"></span>

      <span class="user-name">Administrador</span>

      <button mat-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
