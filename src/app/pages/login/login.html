<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>eGesVen</mat-card-title>
      <mat-card-subtitle>Sistema de Gestión de Ventas</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()">
        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            name="password"
            [(ngModel)]="password"
            required
          />
        </mat-form-field>

        @if (errorMessage) {
          <p class="error-message">{{ errorMessage }}</p>
        }

        <button mat-flat-button type="submit">
          Iniciar sesión
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
